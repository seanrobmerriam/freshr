name: Publish

# Publishing is manual: the npm package names and scope for this fork still
# need to be decided. By default this only performs a dry run.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only pack the packages, don't publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in build-id fresh plugin-vite plugin-tailwindcss plugin-tailwindcss-v3 init update; do
            (cd "packages/$pkg" && bun publish --access public ${{ inputs.dry-run && '--dry-run' || '' }})
          done
