name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qP '^(chore|ci|docs|feat|fix|perf|refactor|test):'; then
            echo "::error::PR title must start with chore:, ci:, docs:, feat:, fix:, perf:, refactor: or test:"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        bun: ["latest", "canary"]
        os: [macOS-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Verify formatting
        if: startsWith(matrix.os, 'ubuntu') && matrix.bun == 'latest'
        run: bun run fmt:check

      - name: Spell-check
        if: startsWith(matrix.os, 'ubuntu') && matrix.bun == 'latest'
        uses: crate-ci/typos@master

      - name: Type check project
        run: bun run check:types

      - name: Run tests
        run: bun run test

      - name: Check docs
        run: bun run check:docs

      - name: Build usefresh.dev
        if: startsWith(matrix.os, 'ubuntu') && matrix.bun == 'latest'
        run: bun run build-www

      - name: Check links
        if: startsWith(matrix.os, 'ubuntu') && matrix.bun == 'latest'
        run: bun run check:links
